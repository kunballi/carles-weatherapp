name: CI/CD

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

env:
  DOCKERHUB_USERNAME: kunballi
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-push-and-update-manifests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker images
        run: |
          docker build -t $DOCKERHUB_USERNAME/weather-ui:$IMAGE_TAG ./UI
          docker build -t $DOCKERHUB_USERNAME/weather-auth:$IMAGE_TAG ./auth
          docker build -t $DOCKERHUB_USERNAME/weather-service:$IMAGE_TAG ./weather

      - name: Push Docker images
        run: |
          docker push $DOCKERHUB_USERNAME/weather-ui:$IMAGE_TAG
          docker push $DOCKERHUB_USERNAME/weather-auth:$IMAGE_TAG
          docker push $DOCKERHUB_USERNAME/weather-service:$IMAGE_TAG

      - name: Update Kubernetes image tags
        run: |
          sed -i "s|image: $DOCKERHUB_USERNAME/weather-ui:.*|image: $DOCKERHUB_USERNAME/weather-ui:$IMAGE_TAG|g" k8s/ui.yaml
          sed -i "s|image: $DOCKERHUB_USERNAME/weather-auth:.*|image: $DOCKERHUB_USERNAME/weather-auth:$IMAGE_TAG|g" k8s/auth.yaml
          sed -i "s|image: $DOCKERHUB_USERNAME/weather-service:.*|image: $DOCKERHUB_USERNAME/weather-service:$IMAGE_TAG|g" k8s/weather.yaml

      - name: Commit updated Kubernetes manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/ui.yaml k8s/auth.yaml k8s/weather.yaml
          git diff --cached --quiet || git commit -m "chore(ci): update image tags to $IMAGE_TAG"
          git push
