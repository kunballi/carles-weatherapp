apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: weather-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: kunballi/weather-ui:abc0d513c8a9b33e55eef86205dce49ef182c5cb
          ports:
            - containerPort: 3000
          env:
            - name: AUTH_HOST
              value: auth
            - name: AUTH_PORT
              value: "8080"
            - name: WEATHER_HOST
              value: weather
            - name: WEATHER_PORT
              value: "5000"
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: _REDIS_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: weather-app
spec:
  selector:
    app: ui
  ports:
    - port: 3000
      targetPort: 3000
