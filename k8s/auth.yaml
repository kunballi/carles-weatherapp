apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: weather-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z db 3306; do echo "waiting for mysql"; sleep 5; done
      containers:
        - name: auth
          image: kunballi/weather-auth:abc0d513c8a9b33e55eef86205dce49ef182c5cb
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: db
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MYSQL_ROOT_PASSWORD
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: weather-app
spec:
  selector:
    app: auth
  ports:
    - port: 8080
      targetPort: 8080
