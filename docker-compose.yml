services:
  db:
    image: mysql:8.0.2
    container_name: kunballi-tarzan-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - kunballi-tarzan-net
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: kunballi-tarzan-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    networks:
      - kunballi-tarzan-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  weather:
    build:
      context: ./weather
    image: kunballi-tarzan-weather:local
    container_name: kunballi-tarzan-weather
    restart: unless-stopped
    environment:
      APIKEY: ${APIKEY}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kunballi-tarzan-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  auth:
    build:
      context: ./auth
    image: kunballi-tarzan-auth:local
    container_name: kunballi-tarzan-auth
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kunballi-tarzan-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  ui:
    build:
      context: ./UI
    image: kunballi-tarzan-ui:local
    container_name: kunballi-tarzan-ui
    restart: unless-stopped
    environment:
      AUTH_HOST: auth
      AUTH_PORT: 8080
      WEATHER_HOST: weather
      WEATHER_PORT: 5000
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      auth:
        condition: service_healthy
      weather:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - kunballi-tarzan-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  kunballi-tarzan-net:
    name: kunballi-tarzan-net

volumes:
  db-data:
    name: kunballi-tarzan-db-data
  redis-data:
    name: kunballi-tarzan-redis-data
